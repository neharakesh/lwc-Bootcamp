<template>
    <lightning-card title="Order Management" icon-name="standard:orders">

        <!-- Account Section -->
                <div class="slds-p-horizontal_medium slds-p-bottom_medium">

                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <h2 class="slds-text-heading_small slds-m-bottom_small">
                        Account
                        </h2>

                        <template for:each={accountList} for:item="item">
                        <div key={item.Id} class="slds-text-body_regular">
                                <strong>Account Name:</strong> {item.Name}
                        </div>
                        </template>
                </div>


                <!-- Product Section -->
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Products
                </h2>

                <div class="slds-grid slds-wrap slds-gutters">

                        <template for:each={productList} for:item="item">

                        <div
                                key={item.Id}
                                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium">

                                <div class="slds-box slds-theme_default">

                                <div class="slds-text-heading_small slds-m-bottom_small">
                                        {item.Name}
                                </div>

                                <div class="slds-m-top_small">
                                        <button
                                        data-id={item.Id}
                                        class="slds-button slds-button_brand"
                                        onclick={handleAddToCart}>

                                        Add to Cart
                                        </button>
                                </div>

                                </div>

                        </div>

                        </template>

                </div>


                <!-- Cart Section -->
                <div class="slds-box slds-theme_shade slds-m-top_large">

                        <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Cart
                        </h2>

                        <template if:true={cart.length}>

                        <template for:each={cart} for:item="cartItem">

                                <div
                                key={cartItem.Id}
                                class="slds-box slds-theme_default slds-m-bottom_small">

                                <div class="slds-grid slds-wrap slds-grid_align-spread">

                                        <div class="slds-col">
                                        <p class="slds-text-heading_small">
                                                {cartItem.Name}
                                        </p>

                                        <p class="slds-text-body_small slds-m-top_x-small">
                                                Quantity: {cartItem.quantity}
                                        </p>
                                        </div>

                                        <div class="slds-col slds-no-flex">

                                        <button
                                                data-id={cartItem.Id}
                                                class="slds-button slds-button_destructive"
                                                onclick={handleRemoveFromCart}>

                                                Remove
                                        </button>

                                        </div>

                                </div>

                                </div>

                        </template>

                        </template>

                        <template if:false={cart.length}>

                        <div class="slds-text-align_center slds-p-around_medium">
                                <p class="slds-text-color_weak">
                                Your cart is empty.
                                </p>
                        </div>

                        </template>

                </div>

                </div>

        </lightning-card>
</template>
