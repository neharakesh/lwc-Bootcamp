<template>
        <div class="slds-box">

        <h1 class="slds-text-heading_large slds-text-align_center slds-p-around_medium">Show All Contacts</h1>
        <template if:true={isloading}>
                <lightning-spinner alternative-text="loading" size="medium"></lightning-spinner>
        </template>
        <lightning-card  >

                <lightning-datatable key-field="Id" columns={columns} data={contactList} onrowselection={handleRowSelection}></lightning-datatable>
                <button class="slds-button slds-button_brand" disabled={isDisabled}  onclick={handleOnClick}>Submit</button>
                <h1> show heading</h1>
        </lightning-card>
        </div>
</template>
