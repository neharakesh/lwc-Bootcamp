<template>
        <div class="slds-box">
                <h1 class="slds-text-heading_large slds-m-around-medium slds-text-align_center">Opportunity Records</h1>
                <lightning-card>
                        <template if:true={opportunityList}>
                                <template for:each={opportunityList} for:item="item">
                                        <div class="slds-box slds-m-around_small" key={item.Id} style="display: flex;">
                                                <p  >Opportunity Name:{item.Name}</p>
                                                <button class="slds-button slds-button_brand" onclick={handleOnClick} data-id={item.Id}>Submit</button>
                                        </div>
                                
                        </template>
                        </template>
                        
                        <template if:true={opportunityError}>
                                <p>no contents</p>
                                {opportunityError}
                        </template>
                </lightning-card>
        </div>
</template>
