<template>
        <div class="slds-box">
                <h1 class="slds-text-heading_large slds-text-align_center slds-m-around_medium">Support Console</h1>
                <template for:each={listAccounts} for:item="account">
                        <div key={account.Id} class="slds-grid slds-box" onclick={handleId} data-id={account.Id}>
                                {account.Name}
                        </div>
                </template>
              <h1 class="slds-text-heading_large slds-text-align_center slds-m-around_medium">Related Cases</h1>
                <template if:true={caseList}>
                        <template for:each={caseList} for:item="caseItem">
                                <div key={caseItem.Id}>
                                        <p>Case subject:{caseItem.Subject}</p>
                                        <p>Case Id:{caseItem.Id}</p>
                                        <p>Case status:{caseItem.Status}</p>
                                        <button class="slds-button slds-button_brand" onclick={handleResolveCase}>Resolve</button>
                                        <!-- <h2>Number of Open Cases</h2>
                                        {openCaseCount} -->
                                        
                                </div>
                        </template>
                </template>

                <template if:true={CaseError}>
                        <p>Error Loading Data</p>
                </template>
        </div>
</template>
