<template>
        <lightning-card title="Employee Leave Manager">
        <div class="slds-p-around_medium">
        <h1 class="slds-text-heading_medium slds-m-bottom_medium">Employee Leave Details</h1>
        <p class="slds-m-bottom_small">Employee Name: {employeeName}</p>
        <p class="slds-m-bottom_medium">
                Available Leave Balance:
                {leaveBalance} Days
        </p>

                <c-leave-request-form leave-balance={leaveBalance} onleaverequest={handleLeaveRequest}></c-leave-request-form>
                        <template if:true={successMessage}>
                        <div class="slds-notify slds-notify_alert slds-theme_success slds-m-top_medium">{successMessage}</div>
                </template>

        </div>

        </lightning-card>
</template>
