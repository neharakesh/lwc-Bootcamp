<template>
        <h1>Create and edit record</h1>
        


        <template if:true={recordId}>
                <lightning-record-edit-form object-api-name="Account" record-id={recordId}>
                <lightning-messages></lightning-messages>
                <div class="slds-grid">
                <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Name"></lightning-input-field>
                        <lightning-input-field field-name="Type"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Phone"></lightning-input-field>
                        <lightning-input-field field-name="Industry"></lightning-input-field>
                </div>
                </div>
                <div class="slds-m-top_medium">
                <lightning-button type="submit" variant="brand" label="Edit" onclick={handleNotification}></lightning-button>
                <lightning-button type="button" variant="brand" label="Reset" onclick={handleReset}></lightning-button>
                </div>
                </lightning-record-edit-form>
        </template>
        <template if:false={recordId}>
                <lightning-record-form object-api-name="Account" fields={fields} onsuccess={handleSuccess}></lightning-record-form>
        </template>
</template>
