<template>
        <div class="slds-box"> 

        

        <h1 class="slds-text-heading_large slds-text-align_center slds-m-around_medium slds-p-around_medium">Case List</h1>
        <div class="slds-grid slds-grid_align-center slds-m-around_medium">
        <button
        class="slds-button slds-button_brand" onclick={handleCase}> Get Cases</button>
        </div>
        <lightning-card>

                <template for:each={caseList} for:item="it">
                        <div key={it.id} class="slds-grid slds-gutters slds-p-around_small">
                                <div class="slds-col slds-size-1-of-3">
                                        {it.Subject} 
                                </div >
                                <div class="slds-col slds-size-1-of-3">
                                        {it.Id}
                                </div>
                                <div class="slds-col slds-size-1-of-3">
                                        {it.Status}
                                </div>
                                
                        
                        
                        </div>
                        
                </template>
        </lightning-card>
        </div>
</template>
