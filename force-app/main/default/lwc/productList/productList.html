<template>
        <div class="slds-p-around_large">

                <h1 class="slds-text-heading_large slds-text-align_center slds-m-bottom_large">
                Product List
                </h1>

                <template for:each={productList} for:item="product">

                <div key={product.id} class="slds-m-bottom_medium">

                        <div class="slds-box slds-theme_default">

                        <div class="slds-grid slds-grid_vertical-align-center">

                                <!-- Product Name -->
                                <div class="slds-col slds-size_1-of-2">
                                <p class="slds-text-heading_medium">
                                        {product.productName}
                                </p>
                                </div>

                                <!-- Price -->
                                <div class="slds-col slds-size_1-of-4 slds-text-align_center">
                                <p class="slds-text-heading_small">
                                        ₹{product.price}
                                </p>
                                </div>

                                <!-- Button -->
                                <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                <button
                                        class="slds-button slds-button_brand"
                                        onclick={handleAddToCart}
                                        data-id={product.id}>
                                        Add To Cart
                                </button>
                                </div>

                        </div>

                        </div>

                </div>

                </template>

        </div>
</template>
